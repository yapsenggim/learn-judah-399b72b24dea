html,body{margin:0;height:100%;font-family:"Nunito","Baloo 2","Trebuchet MS",system-ui,sans-serif;background:linear-gradient(160deg,#fff7e0,#e6f4ff);color:#1d2340;overflow:hidden;user-select:none}
#app{height:100dvh;display:flex;flex-direction:column}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 14px 16px;min-height:0}
.card{background:#fff;border-radius:36px;box-shadow:0 14px 40px rgba(30,40,90,.13);padding:18px;width:min(100%,1040px);display:flex;flex-direction:column;align-items:center;gap:12px;max-height:100%}

.title small,.py{font-size:.5em;color:#7a8199;font-weight:700}
.speak{background:#ffe66d;box-shadow:0 6px 0 #e0b800}.speak.big{min-width:92px;min-height:92px}
.row2{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.wide{padding:0 26px;gap:10px;font-size:26px;font-weight:900}.wide.go{background:#4d96ff;color:#fff;box-shadow:0 6px 0 #2a6ad1}
.note{font-size:22px;margin:0}
/* map */
.mapmain{padding:4px 10px 10px}
.map{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;box-shadow:0 14px 40px rgba(30,40,90,.18)}
.mapbg{position:absolute;inset:0;width:100%;height:100%}
.place{position:absolute;transform:translate(-50%,-50%)}

.disc{width:clamp(96px,15vmin,148px);height:clamp(96px,15vmin,148px);border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.2),0 0 0 6px #fff;animation:bob 3s ease-in-out infinite}
.place:nth-of-type(2) .disc{animation-delay:-.6s}.place:nth-of-type(3) .disc{animation-delay:-1.2s}.place:nth-of-type(4) .disc{animation-delay:-1.8s}.place:nth-of-type(5) .disc{animation-delay:-2.4s}
.disc svg{width:66%;height:66%}
.pl{background:#fff;border-radius:16px;padding:4px 12px;font-weight:900;font-size:clamp(15px,2.3vmin,23px);box-shadow:0 4px 0 rgba(0,0,0,.12);white-space:nowrap;color:#1d2340}
.place.ready .disc{box-shadow:0 8px 0 rgba(0,0,0,.2),0 0 0 6px #fff,0 0 0 13px rgba(255,230,109,.85)}
.place .soon{position:absolute;top:-6px;left:-10px;background:#fff;color:#777;border-radius:12px;font-size:13px;font-weight:800;padding:2px 8px}
.place .speak{position:absolute;right:-46px;top:6px;min-width:80px;min-height:80px;border-radius:50%;transform:scale(.72);transform-origin:top left}
.place .speak svg{width:44px;height:44px}
.pbtn:active .disc{transform:scale(.92)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.buddies{display:flex;align-items:flex-end;gap:4px;pointer-events:none}
.map .buddies{position:absolute;left:50%;transform:translateX(-50%);bottom:2%}
.buddy{width:clamp(30px,5vmin,48px);height:auto;overflow:visible}
.buddy .arm{transform-origin:34px 50%;transform-box:view-box;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}

.crt{animation:idle 2.4s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4%) scale(1.02,.98)}}
.jump{animation:jump .5s ease-out 3!important}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-30%)}}
/* question */
.qhead{display:flex;align-items:center;gap:14px;width:100%;justify-content:center}
.qlabel{font-size:clamp(30px,5vw,50px);font-weight:900;display:flex;align-items:center;gap:8px}

.qwrap{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:0}

.vis{flex:1;width:100%;max-width:680px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;align-content:center;background:#f4f8ff;border-radius:30px;padding:12px;min-height:0;overflow:hidden}

.choices{display:flex;gap:16px;justify-content:center}
.choice{min-width:120px;min-height:112px;font-size:52px;font-weight:900;color:#4d96ff;border-radius:30px;padding:6px 10px;flex-direction:column}
.choice svg{width:84px;height:84px}
.choice.dim{opacity:.35}.choice.right{background:#c8f7c5;color:#1f8a3a;box-shadow:0 6px 0 #7fd17a}

.choices.hidden{display:none}
.dots{display:flex;gap:8px}.dots i{width:20px;height:20px;border-radius:50%;background:#dde5f2}.dots i.done{background:#ffb703}.dots i.cur{outline:4px solid #4d96ff}
.mates{display:flex;align-items:flex-end;justify-content:center;gap:12px;min-height:70px}

.obj{width:var(--s,min(13vmin,84px));height:var(--s,min(13vmin,84px));border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .2s,background .2s}
.obj svg{width:88%;height:88%}.obj.on{background:#ffe66d;transform:scale(1.1)}.obj.gone{opacity:.25;filter:grayscale(1)}
.obj.mini{--s:min(5.5vmin,34px)}
.obj .k{position:absolute;bottom:-6px;right:-4px;background:#4d96ff;color:#fff;font-weight:900;border-radius:12px;font-size:17px;padding:0 7px}
.grp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:46%}.plus{font-size:60px;font-weight:900;color:#4d96ff}
.vis .grp:only-child{max-width:100%}
.frames{display:flex;flex-direction:column;gap:12px}.frames.two{--s:min(7.5vmin,62px)}
@media (orientation:landscape){.frames.two{flex-direction:row;--s:min(6.6vw,9vh,66px)}}
.frame{display:grid;grid-template-columns:repeat(5,auto);gap:4px;background:#fff;border:4px solid #4d96ff;border-radius:16px;padding:6px}
.cell{width:calc(var(--s,min(13vmin,84px)) + 6px);height:calc(var(--s,min(13vmin,84px)) + 6px);border-radius:12px;background:#eef3fb;display:flex;align-items:center;justify-content:center}
.pv{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.rod{display:flex;flex-direction:column;width:auto;height:auto;border-radius:6px;padding:0;gap:0}
.rod i,.cube{display:block;width:min(4.6vmin,30px);height:min(4.6vmin,30px);background:#22a34a;border:2px solid #187a36;border-radius:4px}
.ones{display:grid;grid-template-columns:repeat(2,auto);gap:3px}.ones .cube{background:#2e6bff;border-color:#1f4fc4}
.rod.on i,.cube.on{background:#ffd23f;border-color:#e0a800}
.cube.obj{border-radius:4px}
.m10{display:flex;gap:28px;align-items:flex-end}
.stack{display:flex;flex-direction:column-reverse;border:4px dashed #4d96ff;border-radius:12px;padding:4px;gap:2px;background:#fff}
.slot{width:min(8vmin,54px);height:min(5vmin,34px);display:flex}.slot .cube,.stack .cube{width:100%;height:100%;background:#ff7a00;border-color:#c45c00}
.loose{display:grid;grid-template-columns:repeat(3,auto);gap:10px}
.loose .cube{width:min(11vmin,80px);height:min(11vmin,80px);background:#ff7a00;border-color:#c45c00;cursor:grab;touch-action:none;transition:none}
.loose .cube.drag{z-index:5;position:relative;box-shadow:0 10px 20px rgba(0,0,0,.25)}
.eqbig{font-size:clamp(56px,10vmin,96px);font-weight:900;text-align:right;line-height:1.1}.eqbig span{color:#1d2340}
.column{display:grid;grid-template-columns:repeat(calc(var(--w) + 1),auto);gap:6px;font-size:clamp(40px,8vmin,72px);font-weight:900}
.cc{width:1.15em;height:1.25em;display:flex;align-items:center;justify-content:center;border-radius:12px;transition:background .2s}
.cc.lab{font-size:.32em;color:#fff;height:1.8em;width:3.6em;margin:0 auto;border-radius:10px;align-self:end}
.cc.ans{border:4px dashed;font-size:.8em;width:1.4em;height:1.4em;opacity:.6}
.cc.on{background:#fff2a8}.cc.op{color:#1d2340}
.line{grid-column:1/-1;height:6px;background:#1d2340;border-radius:3px}
.seq{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.seq span{font-size:clamp(40px,8vmin,70px);font-weight:900;background:#fff;border-radius:20px;padding:6px 18px;color:#4d96ff}.seq .qm{color:#ff7a00}
.egrps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.egrp{border:4px solid #a77bff;border-radius:24px;padding:6px;display:flex;flex-wrap:wrap;max-width:min(26vmin,170px);gap:2px;justify-content:center;align-items:center;min-width:60px;min-height:60px;background:#fff}
.egrp b{font-size:clamp(26px,5vmin,40px);color:#a77bff}.egrp.on{background:#fff2a8}
.swatch{width:86px;height:86px;border-radius:50%;border:4px solid #d5dbe8;display:block}
.dotsn{display:grid;grid-template-columns:repeat(5,auto);gap:4px}.dotsn i{width:16px;height:16px;border-radius:50%;background:#e84a8a;display:block}
.sciobj svg{width:min(40vmin,260px);height:min(40vmin,260px)}
.ci svg{width:76px;height:76px}.cl{font-size:22px;color:#1d2340}
/* menus */
.tiles4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:100%}
@media (orientation:landscape){.tiles4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tw{position:relative}.tw .speak{position:absolute;top:-8px;right:-8px}
.tile{width:100%;border:0;cursor:pointer;font:inherit;border-radius:32px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:clamp(22px,3.6vw,32px);font-weight:900;box-shadow:0 10px 0 rgba(0,0,0,.18);min-height:190px;padding:12px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.tile svg{width:96px;height:96px}.tile small{font-size:.6em}.hz{font-size:50px}.hz2{font-size:1.3em}
.sw4{display:flex;gap:4px}.sw4 i{width:30px;height:30px;border-radius:50%;border:3px solid #fff}
.playbig{width:240px;height:200px;gap:10px;font-size:70px;color:#4d96ff}.playbig .buddy{width:60px}
.ladder{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.ladder span{width:44px;height:44px;border-radius:50%;background:#eef3fb;display:flex;align-items:center;justify-content:center;font-weight:900;color:#9aa3b5}
.ladder .done{background:#ffd23f;color:#5a3a00}.ladder .cur{background:#4d96ff;color:#fff}
.endstars{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.endstars svg{width:min(14vw,84px)}
.big-emoji svg{width:min(50vw,30vh);height:auto}
.coll-card{overflow:auto}
.cgrid{display:grid;grid-template-columns:repeat(3,auto);gap:12px}.cgrid.robots .cslot{background:#eaf2ff}
@media (orientation:landscape){.cgrid{grid-template-columns:repeat(9,auto)}.cgrid.robots{grid-template-columns:repeat(3,auto)}}
.cslot{width:clamp(84px,13vmin,120px);height:clamp(84px,13vmin,120px);border-radius:24px;background:#f4f8ff}.cslot svg{width:86%;height:86%}
.cslot.locked svg{filter:brightness(0);opacity:.3;animation:none}.cslot.locked .crt,.cslot.locked .eyes{animation:none}
.robot .veh{opacity:0}
/* overlays */
.ovl{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ovl.dim{background:rgba(29,35,64,.45)}
.burst{pointer-events:none;z-index:25}.burst svg{width:min(46vw,46vh);animation:pop .7s ease-out both}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.9s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.hatch{background:rgba(255,248,225,.95)}
.hatch .egg svg,.hatch .crit svg,.rbox svg{width:min(56vw,42vh);height:auto}
.hatch .egg{animation:wobble .4s ease-in-out infinite}.hatch .egg.evo{animation:shimmer .5s ease-in-out infinite}
.hatch .crit,.hatch .hname{display:none}
.hatch.open .egg{display:none}.hatch.open .crit{display:block;animation:pop .7s ease-out both}
.hatch.open .hname,.tf .hname{display:block;font-size:44px;font-weight:900}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes shimmer{50%{filter:brightness(1.6) drop-shadow(0 0 20px #fff)}}
.tf{background:radial-gradient(circle,#fff6c7,#ffd9a0)}
.tf .robot .bot,.tf .robot .veh{transform-box:view-box;transform-origin:50% 60%;transition:transform .6s cubic-bezier(.5,-0.4,.5,1.4),opacity .5s}
.tf .robot .bot{animation:bounce .5s ease-in-out infinite alternate}
.tf.go .robot .bot{opacity:0;transform:scale(.3) rotate(180deg);animation:none}
.tf .robot .veh{transform:scale(.3) rotate(-180deg)}
.tf.go .robot .veh{opacity:1;transform:none;animation:zoom 1.2s .6s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-4%)}}
@keyframes zoom{to{transform:translateX(6%)}}
table{font-size:21px;border-collapse:collapse}td{padding:6px 14px;border-bottom:1px solid #eee}
.hold{position:relative;overflow:hidden;width:260px;height:110px;font-size:26px;font-weight:800}.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffe66d}.hold span{position:relative}
.hidden{display:none}
@media (max-width:480px){.choice{min-width:96px;min-height:104px;font-size:42px}.choices{gap:10px}.card{padding:12px}.top{min-height:92px}.place .speak{right:-40px}}

.choice{white-space:nowrap}.choice.long{font-size:clamp(30px,5vmin,46px);min-width:140px}
.qhead{flex-wrap:wrap}.zhq{white-space:nowrap}
.ci svg{width:92px;height:92px}.cl{font-size:24px;font-weight:900}
@media (max-width:480px){.choice.long{min-width:100px;font-size:28px;padding:4px}}

.cn{display:inline-flex}.cslot.locked svg{opacity:.6}
.swatch{width:min(24vmin,120px);height:min(24vmin,120px)}.choice svg{width:min(20vmin,110px);height:min(20vmin,110px)}
/* picture word problems + missing factor */
.wpic{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}

.hootrow{display:flex;align-items:center;gap:8px}.hootw svg{width:72px;height:80px}.hootw .wing{transform-origin:64px 50px;animation:point 1s ease-in-out infinite alternate}

.cc{position:relative}.cc s{opacity:.55;text-decoration-thickness:4px;text-decoration-color:#ff3b3b}
